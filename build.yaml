include:
  - board: nice_nano_v2
    shield: a_dux_left
    artifact-name: kalmar-left
  # Right controller's DC/DC inductor is damaged (water) -> firmware only boots with DCDC off
  - board: nice_nano_v2
    shield: a_dux_right
    cmake-args: -DCONFIG_BOARD_ENABLE_DCDC=n
    artifact-name: kalmar-right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings-reset
  - board: nice_nano_v2
    shield: settings_reset
    cmake-args: -DCONFIG_BOARD_ENABLE_DCDC=n
    artifact-name: settings-reset-right
